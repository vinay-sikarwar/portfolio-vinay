<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2b27"/>
      <stop offset="100%" stop-color="#161514"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce182"/>
      <stop offset="100%" stop-color="#d99b26"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.45"/>
  
  <!-- Crown Icon -->
  <g filter="url(#softGlow)">
    <path d="M21 24 L24.5 15.5 L32 20.5 L39.5 15.5 L43 24 Z" fill="url(#goldGrad)" stroke="#ab7714" stroke-width="0.8" stroke-linejoin="round"/>
    <circle cx="24.5" cy="15.5" r="1.5" fill="#fff"/>
    <circle cx="32" cy="20.5" r="1.5" fill="#fff"/>
    <circle cx="39.5" cy="15.5" r="1.5" fill="#fff"/>
    
    <!-- Bold Elegant V Monogram -->
    <path d="M21 28.5 L32 50 L43 28.5" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
